services:
  rpgnotes:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rpgnotes:latest
    # No `user:` / `group_add:` here on purpose. The container starts as root
    # and docker/entrypoint.sh detects the host user and the GPU device GIDs
    # (/dev/kfd, /dev/dri) at startup, then drops privileges. This keeps the
    # setup portable across machines and working with bare `docker compose run`.
    devices:
      - /dev/kfd
      - /dev/dri
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    volumes:
      - ${DOWNLOADS_DIR:-./Downloads}:/data/downloads
      - ${OUTPUT_DIR:-./output}:/data/output
      - ${CONTEXT_DIR:-./context}:/data/context
      - ./models:/data/models
      - ./prompts:/app/prompts:ro
      - ./template.md:/app/template.md:ro
      - ./discord_speaker_mapping.json:/app/discord_speaker_mapping.json:ro
      # Session screenshots (Plan E). Unset in .env falls back to a harmless
      # repo-local dir.
      - ${SCREENSHOTS_DIR:-./screens_session}:/data/screenshots
      # Curated ASR-misspelling table living in the OotD repo; /dev/null when unset
      # (reads as an empty file inside the container).
      - ${PHONETIC_CORRECTIONS_FILE:-/dev/null}:/app/phonetic_corrections.md:ro
      # Uncomment to persist temp state (transcriptions, interim AI files) across runs:
      - ./temp:/data/temp
    environment:
      # Non-root user has no /etc/passwd entry → $HOME defaults to /. Redirect
      # it into the temp mount so ROCm (MIOpen kernel cache) and any tools
      # that write to ~/.cache (HuggingFace, etc.) land on writable host disk.
      HOME: /data/temp
      DOWNLOADS_DIR: /data/downloads
      OUTPUT_DIR: /data/output
      CONTEXT_DIR: /data/context
      TEMP_DIR: /data/temp
      WHISPER_CACHE_DIR: /data/models
      LOG_FILE: /data/temp/session_processor.log
      DISCORD_MAPPING_FILE: /app/discord_speaker_mapping.json
      WHISPER_PROMPT_FILE: /app/prompts/whisper.txt
      SUMMARY_PROMPT_FILE: /app/prompts/summary.txt
      QUOTES_PROMPT_FILE: /app/prompts/quotes.txt
      STYLE_RULES_FILE: /app/prompts/style_rules.txt
      ANTI_HALLUCINATION_FILE: /app/prompts/anti_hallucination.txt
      VALIDATION_PROMPT_FILE: /app/prompts/validation.txt
      VISUAL_CAPTION_PROMPT_FILE: /app/prompts/visual_caption.txt
      PHONETIC_CORRECTIONS_FILE: /app/phonetic_corrections.md
      SCREENSHOTS_DIR: /data/screenshots
      TEMPLATE_FILE: /app/template.md
      # Tunables passed through from .env (defaults mirror src/rpgnotes/config.py)
      SUMMARY_CHUNK_LINES: ${SUMMARY_CHUNK_LINES:-800}
      SUMMARY_TEMPERATURE: ${SUMMARY_TEMPERATURE:-0.3}
      SUMMARY_POLISH_PASS: ${SUMMARY_POLISH_PASS:-true}
      SUMMARY_POLISH_TEMPERATURE: ${SUMMARY_POLISH_TEMPERATURE:-0.7}
      TIMELINE_RECENT_SESSIONS: ${TIMELINE_RECENT_SESSIONS:-10}
      VISUAL_DEDUPE: ${VISUAL_DEDUPE:-true}
      VISUAL_UPLOAD_MAX_DIM: ${VISUAL_UPLOAD_MAX_DIM:-1536}
      VISUAL_UPLOAD_JPEG_QUALITY: ${VISUAL_UPLOAD_JPEG_QUALITY:-80}
      VISUAL_CROP: ${VISUAL_CROP:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.1-pro-preview}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-3-flash-preview}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pl}
      # ROCm workaround for HIP page-fault between successive transcribe() calls
      # on RDNA2/RDNA4 (CT2 issue OpenNMT/CTranslate2#2012). Forces the CUB caching
      # allocator instead of the default async allocator.
      CT2_CUDA_ALLOCATOR: ${CT2_CUDA_ALLOCATOR:-cub_caching}
    stdin_open: true
    tty: true
